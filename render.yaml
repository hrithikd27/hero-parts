services:
  - type: web
    name: hero-parts-backend
    runtime: docker
    # Build context = repo root so Docker can copy data/heropartsdb.mv.db
    dockerfilePath: hero-parts-platform/Dockerfile
    dockerContext: .
    plan: free
    region: singapore
    # Render injects PORT automatically; Spring reads it via ${PORT:8080}
    healthCheckPath: /api/v1/search/suggest?q=a
    envVars:
      - key: GEMINI_API_KEY
        sync: false          # set manually in Render dashboard
      - key: CLAUDE_API_KEY
        sync: false
      - key: HF_TOKEN
        sync: false
      - key: SPRING_PROFILES_ACTIVE
        value: cloud
