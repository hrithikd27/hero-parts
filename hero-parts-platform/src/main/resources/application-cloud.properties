# Cloud Run / Render — loaded when SPRING_PROFILES_ACTIVE=cloud
# All secrets are read from environment variables set in the hosting dashboard.

# Port — Render and Cloud Run both inject $PORT
server.port=${PORT:8080}

# H2 file-based DB bundled in the Docker image
spring.datasource.url=jdbc:h2:file:/app/data/heropartsdb;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.sql.init.mode=never

# Disable H2 browser console in production
spring.h2.console.enabled=false

# Log to stdout (captured by Render / Cloud Run)
logging.file.name=
logging.level.com.hero.parts=INFO

# CORS — Firebase hosting + Vercel (wildcard covers preview URLs too)
app.cors.allowed-origins=https://parts-finder-hrithik.web.app,https://parts-finder-hrithik.firebaseapp.com,https://*.vercel.app,http://localhost:5173,http://localhost:3000

# Image upload
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB

# Gemini AI — set GEMINI_API_KEY in Render / Cloud Run environment variables
app.gemini.api-key=${GEMINI_API_KEY}
app.gemini.model=gemini-2.5-flash

# Claude AI — set CLAUDE_API_KEY in Render / Cloud Run environment variables
app.claude.api-key=${CLAUDE_API_KEY}
app.claude.model=claude-haiku-4-5-20251001

# Hugging Face — set HF_TOKEN in Render / Cloud Run environment variables (optional)
app.huggingface.token=${HF_TOKEN:}
