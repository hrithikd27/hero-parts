spring.application.name=hero-parts-platform
server.port=9090

# H2 Database (file-based so data persists across restarts)
spring.datasource.url=jdbc:h2:file:./data/heropartsdb;DB_CLOSE_DELAY=-1;MODE=MySQL;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-max-rows=50000

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false

# SQL init
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.data-locations=classpath:data.sql

# SpringDoc / Swagger
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# CORS
app.cors.allowed-origins=https://parts-finder-hrithik.web.app,https://parts-finder-hrithik.firebaseapp.com,http://localhost:5173,http://localhost:3000,http://localhost:4200

# Search config
app.search.fuzzy-threshold=0.65
app.search.max-results=20

# Logging
logging.file.name=logs/app.log
logging.level.com.hero.parts=DEBUG

# Claude AI — server-side key (never exposed to the browser)
